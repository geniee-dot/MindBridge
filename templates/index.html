<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindBridge: Gen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #e8f5f0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #e8f5f0;
        }

        .header {
            text-align: center;
            padding: 20px 20px 10px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #1d9e75;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 600;
            color: #0f6e56;
        }

        .subtitle {
            font-size: 13px;
            color: #1d9e75;
        }

        .crisis-banner {
            margin: 10px 20px;
            background: #fff8e6;
            border-left: 3px solid #1d9e75;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #0f6e56;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
        }

        .message-wrapper.user {
            align-items: flex-end;
        }

        .message-wrapper.gen {
            align-items: flex-start;
        }

        .gen-label {
            font-size: 11px;
            color: #1d9e75;
            font-weight: 600;
            margin-bottom: 4px;
            padding-left: 4px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.6;
        }

        .user .message {
            background: #1d9e75;
            color: white;
            border-radius: 16px;
            border-bottom-right-radius: 4px;
        }

        .gen .message {
            background: white;
            color: #085041;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            border: 0.5px solid #9fe1cb;
        }

        .typing {
            font-size: 13px;
            color: #1d9e75;
            padding: 4px 0 4px 4px;
            font-style: italic;
        }

        .input-area {
            padding: 14px 20px 20px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            background: white;
            border: 0.5px solid #9fe1cb;
            border-radius: 28px;
            padding: 8px 8px 8px 18px;
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            color: #085041;
            background: transparent;
            font-family: 'Segoe UI', sans-serif;
        }

        input::placeholder {
            color: #a8d5c5;
        }

        button {
            background: #1d9e75;
            border: none;
            border-radius: 22px;
            padding: 9px 20px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.2s;
        }

        button:hover {
            background: #0f6e56;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🌿</div>
                <span class="logo-text">MindBridge</span>
            </div>
            <p class="subtitle">A safe space to talk. Gen is here to listen.</p>
        </div>

        <div class="crisis-banner">
            In crisis? Call Samaritans free on 116 123, available 24/7
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message-wrapper gen">
                <div class="gen-label">Gen</div>
                <div class="message">
                    Hi, I am Gen. I am here to listen and support you. How are you feeling today?
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Share how you are feeling..."
                    onkeypress="handleKey(event)"
                />
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const message = input.value.trim();

            if (!message) return;

            chatBox.innerHTML += `
                <div class="message-wrapper user">
                    <div class="message">${message}</div>
                </div>
            `;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            chatBox.innerHTML += `<div class="typing" id="typing">Gen is thinking...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                document.getElementById('typing').remove();

                chatBox.innerHTML += `
                    <div class="message-wrapper gen">
                        <div class="gen-label">Gen</div>
                        <div class="message">${data.reply}</div>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                document.getElementById('typing').remove();
                chatBox.innerHTML += `
                    <div class="message-wrapper gen">
                        <div class="gen-label">Gen</div>
                        <div class="message">I am sorry, something went wrong. Please try again.</div>
                    </div>
                `;
            }
        }

        function handleKey(event) {
            if (event.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
